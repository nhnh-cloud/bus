<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>嘉翠園 交通 ETA 2.4.1 </title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-main: #181614;         /* Minimalist dark earth */
            --bg-card: #24201d;         /* Warm taupe earth container */
            --bg-card-alt: #2c2723;     /* Subtle warm row zebra striping */
            --border-color: #3e3832;    /* Warm earth stroke border */
            --text-primary: #f4f1ea;    /* Sandstone white */
            --text-muted: #a8a096;      /* Soft beige muted */
            --accent-earth: #d97706;    /* Warm ochre amber */
            --district-bg: #1e293b;     /* Dark slate blue for district headers */
            --district-text: #38bdf8;   /* Bright cyan district text */
            --eta-red: #d32f2f;         /* Under 9 mins alert */
            --eta-orange: #ef6c00;      /* 9-15 mins warning */
            --eta-green: #2e7d32;       /* > 15 mins relaxed */
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 15px; /* Default smartphone base font */
            line-height: 1.3;
            padding: 8px;
            max-width: 1280px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Responsive Base Typography Rules per Specifications */
        @media (min-width: 600px) and (max-width: 767px) {
            body { font-size: 40px; }
        }

        @media (min-width: 768px) and (max-width: 1024px) {
            body { font-size: 50px; }
        }

        @media (min-width: 1025px) {
            body { font-size: 14px; }
        }

        .app-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .main-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        header {
            padding-bottom: 4px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .header-title {
            font-size: 1.2em;
            font-weight: bold;
            color: var(--text-primary);
            letter-spacing: 0.5px;
        }

        .header-status {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        /* Aligned to inherited body font family */
        .header-timestamp {
            font-size: 0.85em;
            color: var(--accent-earth);
            font-weight: bold;
        }

        .update-counter {
            font-size: 0.75em;
            color: var(--text-muted);
        }

        /* Compact Table Layout & Column Alignment */
        .bus-table {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
            background-color: var(--bg-card);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .bus-table th {
            background-color: #1a1715;
            color: var(--text-muted);
            padding: 6px 6px;
            font-weight: 600;
            font-size: 0.8em;
            border-bottom: 1px solid var(--border-color);
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Explicit Column Width Allocations per Specification */
        .col-route { width: 20%; }
        .col-dir { width: 20%; }
        .col-stop { width: 28%; }
        .col-eta { width: 32%; }

        /* District Header Formatting (Dark Blue Slate #1e293b / Cyan Text #38bdf8) */
        .district-header-row th {
            background-color: var(--district-bg) !important;
            color: var(--district-text) !important;
            font-weight: bold;
            font-size: 0.85em;
            padding: 5px 8px;
            text-align: left;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }

        .bus-row {
            border-bottom: 1px solid #332d28;
        }

        .bus-row:nth-child(even) {
            background-color: var(--bg-card-alt);
        }

        .bus-cell {
            padding: 5px 6px;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            vertical-align: middle;
            font-size: 0.88em;
        }

        /* Solid Rectangular Blue Route Badge (#0055ff) */
        .badge-route {
            display: inline-block;
            background-color: #0055ff;
            color: #ffffff;
            font-weight: bold;
            padding: 2px 5px;
            border-radius: 4px;
            font-size: 0.85em;
            text-align: center;
        }

        /* Aligned with standard route badges */
        .badge-route-shuttle {
            background-color: #0055ff !important;
        }

        /* Dynamic ETA Badges Container */
        .eta-container {
            display: flex;
            gap: 4px;
            flex-wrap: nowrap;
            overflow: hidden;
        }

        .badge-eta {
            display: inline-block;
            color: #ffffff;
            font-weight: bold;
            padding: 2px 4px;
            border-radius: 4px;
            font-size: 0.8em;
            min-width: 26px;
            text-align: center;
        }

        .eta-red { background-color: var(--eta-red); }
        .eta-orange { background-color: var(--eta-orange); }
        .eta-green { background-color: var(--eta-green); }

        .no-data-msg {
            color: var(--text-muted);
            font-size: 0.75em;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="app-container">
        
        <!-- Main Content Section -->
        <div class="main-section">
            <!-- App Header (Mandatory Exact Text Format) -->
            <header>
                <div class="header-title">嘉翠業成街 交通</div>
                <div class="header-status">
                    <div class="header-timestamp" id="header-timestamp">[--]</div>
                    <div class="update-counter" id="update-counter">更新: 0秒前</div>
                </div>
            </header>

            <!-- ETA Table -->
            <table class="bus-table">
                <thead>
                    <tr>
                        <th class="col-route">路線</th>
                        <th class="col-dir">開往</th>
                        <th class="col-stop">車站</th>
                        <th class="col-eta">分鐘</th>
                    </tr>
                </thead>
                <tbody id="bus-table-body">
                    <!-- Dynamic ETA rows generated by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Input Bus Data Set Specification
        const BUS_DATA_RAW = `
KMB 38 平田 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/2658CCFAB79763B6/38/1 觀塘區
KMB 38P 平田 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/8956F5FA7B620297/38P/1 觀塘區
KMB 40P 觀塘碼頭 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/C3672D8D28801773/40P/1 觀塘區
KMB 42C 藍田站 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/2658CCFAB79763B6/42C/1 觀塘區
KMB X42P 藍田站 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/2658CCFAB79763B6/X42P/1 觀塘區
KMB 31B 奧運站 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/26EB1A3C1E17889A/31B/1 油尖旺區
KMB 32 奧運站 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/8998797A3D3E02A7/32/1 油尖旺區
KMB 35A 尖沙咀東 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/8CF45DD1D6B1FA4D/35A/1 油尖旺區
KMB 35X 尖沙咀東 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/8CF45DD1D6B1FA4D/35X/1 油尖旺區
KMB 36B 高鐵西九龍站 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/8998797A3D3E02A7/36B/1 油尖旺區
KMB 36X 尖沙咀東麼地道 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/8998797A3D3E02A7/36X/1 油尖旺區
KMB A30 機場及港珠澳大橋 石排街嘉翠園 https://data.etabus.gov.hk/v1/transport/kmb/eta/BEA270261C1E0D73/A30/1 新界離島區
KMB 936 銅鑼灣棉花路 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/8CF45DD1D6B1FA4D/936/1 港島區
KMB 936A 銅鑼灣棉花路 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/8CF45DD1D6B1FA4D/936A/1 港島區
KMB 40X 烏溪沙站 葵興站 https://data.etabus.gov.hk/v1/transport/kmb/eta/4626B2F2CF370D72/40X/1 沙田區
屋苑 嘉翠園邨巴 葵涌廣場 停車場 SCHEDULE_GREENKNOLL 嘉翠園邨巴
        `.trim();

        // Greenknoll Garden Shuttle Timetable Schedule
        const GREENKNOLL_SCHEDULE = {
            // Monday to Saturday
            weekday: [
                "07:30", "07:50", "08:15", "08:35", "09:00", "09:30",
                "10:30", "11:00", "11:30", "12:00",
                "14:00", "14:30", "15:00", "15:30",
                "17:00", "17:30", "18:00", "18:30", "19:00", "19:30", "20:00", "20:30", "21:00"
            ],
            // Sunday & HK Public Holidays
            holiday: [
                "08:00", "08:30", "09:00", "09:30",
                "10:30", "11:00", "11:30",
                "13:30", "14:00", "14:30", "15:00", "15:30",
                "17:00", "17:30", "18:00", "18:30", "19:00", "19:30", "20:00", "20:30", "21:00"
            ]
        };

        // Strict Sorting Order for Districts
        const DISTRICT_ORDER = [
            '📍 觀塘區',
            '📍 油尖旺區',
            '📍 新界離島區',
            '📍 港島區',
            '📍 沙田區',
            '📍 嘉翠園邨巴'
        ];

        let parsedRoutes = [];
        let hkPublicHolidays = new Set();
        let secondsSinceLastRefresh = 0;
        let counterInterval = null;

        function parseInputDataSet() {
            const lines = BUS_DATA_RAW.split('\n');
            parsedRoutes = [];

            lines.forEach(line => {
                const parts = line.trim().split(/\s+/);
                if (parts.length >= 6) {
                    const [busCoId, route, direction, stopName, targetSrc, district] = parts;
                    
                    // Prepend emoji indicator if needed for consistent matching
                    const formattedDistrict = district.startsWith('📍') ? district : `📍 ${district}`;

                    parsedRoutes.push({
                        busCoId,
                        route,
                        direction,
                        stopName,
                        targetSrc,
                        district: formattedDistrict
                    });
                }
            });
        }

        // Fetch HK Public Holidays from official 1823 iCal JSON API
        async function fetchHKPublicHolidays() {
            try {
                const res = await fetch('https://www.1823.gov.hk/common/ical/en.json');
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.vcalendar && data.vcalendar[0] && data.vcalendar[0].vevent) {
                        data.vcalendar[0].vevent.forEach(event => {
                            if (event.dtstart && event.dtstart[0]) {
                                hkPublicHolidays.add(event.dtstart[0]);
                            }
                        });
                    }
                }
            } catch (err) {
                console.warn('Could not fetch 1823 public holidays:', err);
            }
        }

        // Format HKT timestamp exact string: YYYY MM DD HH:mm 
        function getFormattedHKTimestamp(now) {
            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            
            const dd = String(now.getDate()).padStart(2, '0');
            const mmm = months[now.getMonth()];
            const yyyy = now.getFullYear();

            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');

            return `${yyyy} ${mmm}  ${dd} ${hh}:${mm}` ;
        }

        function isTodayHolidayOrSunday(now) {
            if (now.getDay() === 0) return true; // Sunday

            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const dateStr = `${yyyy}${mm}${dd}`;

            return hkPublicHolidays.has(dateStr);
        }

        function calculateShuttleEtas(now) {
            const isHoliday = isTodayHolidayOrSunday(now);
            const scheduleList = isHoliday ? GREENKNOLL_SCHEDULE.holiday : GREENKNOLL_SCHEDULE.weekday;

            const currentMinutesOfDay = now.getHours() * 60 + now.getMinutes();

            const upcoming = [];
            for (const timeStr of scheduleList) {
                const [h, m] = timeStr.split(':').map(Number);
                const schedMin = h * 60 + m;
                const diffMin = schedMin - currentMinutesOfDay;

                if (diffMin >= 0) {
                    upcoming.push(diffMin);
                    if (upcoming.length === 3) break;
                }
            }
            return upcoming;
        }

        async function fetchRouteEta(routeObj) {
            const now = new Date();

            if (routeObj.targetSrc === 'SCHEDULE_GREENKNOLL') {
                return calculateShuttleEtas(now);
            }

            if (!routeObj.targetSrc.startsWith('https://')) {
                return []; 
            }

            try {
                const response = await fetch(routeObj.targetSrc);
                if (!response.ok) return [];

                const json = await response.json();
                let etaArr = [];

                if (routeObj.busCoId === 'GMB') {
                    if (json && json.data && Array.isArray(json.data.eta)) {
                        etaArr = json.data.eta.map(item => item.diff).filter(diff => diff >= 0);
                    }
                } else {
                    if (json && Array.isArray(json.data)) {
                        etaArr = json.data
                            .filter(item => item.eta)
                            .map(item => {
                                const etaTime = new Date(item.eta);
                                const diffMs = etaTime - now;
                                return Math.floor(diffMs / 60000);
                            })
                            .filter(diffMinutes => diffMinutes >= 0);
                    }
                }

                return etaArr.sort((a, b) => a - b).slice(0, 3);
            } catch (err) {
                console.warn(`Failed to fetch ETA for ${routeObj.route}:`, err);
                return [];
            }
        }

        function renderEtaBadges(minutesArr) {
            if (!minutesArr || minutesArr.length === 0) {
                return `<span class="no-data-msg">尾班車已過</span>`;
            }

            return `<div class="eta-container">` + minutesArr.map(min => {
                let colorClass = 'eta-green';
                if (min < 9) {
                    colorClass = 'eta-red';
                } else if (min <= 15) {
                    colorClass = 'eta-orange';
                }

                const displayText = min === 0 ? '即將' : `${min}分`;
                return `<span class="badge-eta ${colorClass}">${displayText}</span>`;
            }).join('') + `</div>`;
        }

        async function refreshAllBusEtas() {
            const now = new Date();

            // Render exact HKT Header timestamp
            document.getElementById('header-timestamp').textContent = `[${getFormattedHKTimestamp(now)}]`;

            // Reset update counter
            secondsSinceLastRefresh = 0;
            document.getElementById('update-counter').textContent = `更新: 0秒前`;

            const fetchPromises = parsedRoutes.map(async routeObj => {
                const etaArr = await fetchRouteEta(routeObj);
                return {
                    ...routeObj,
                    etas: etaArr
                };
            });

            const routeResults = await Promise.all(fetchPromises);

            const groupedByDistrict = {};
            DISTRICT_ORDER.forEach(dist => {
                groupedByDistrict[dist] = [];
            });

            routeResults.forEach(item => {
                if (groupedByDistrict[item.district]) {
                    groupedByDistrict[item.district].push(item);
                } else {
                    groupedByDistrict[item.district] = [item];
                }
            });

            const tableBody = document.getElementById('bus-table-body');
            tableBody.innerHTML = '';

            // Render districts according to strict specified order
            DISTRICT_ORDER.forEach(districtName => {
                const districtRoutes = groupedByDistrict[districtName] || [];

                // Filter active arrivals
                const activeRoutes = districtRoutes.filter(r => r.etas && r.etas.length > 0);

                // Dynamic Hiding: Hide district section completely if no active arrivals exist
                if (activeRoutes.length === 0) {
                    return;
                }

                // Render District Header Row (#1e293b dark slate / #38bdf8 cyan text)
                const headerTr = document.createElement('tr');
                headerTr.className = 'district-header-row';
                headerTr.innerHTML = `<th colspan="4">${districtName}</th>`;
                tableBody.appendChild(headerTr);

                // Render Route Rows
                activeRoutes.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.className = 'bus-row';

                    const badgeClass = item.busCoId === '屋苑' ? 'badge-route badge-route-shuttle' : 'badge-route';

                    tr.innerHTML = `
                        <td class="bus-cell">
                            <span class="${badgeClass}">${item.route}</span>
                        </td>
                        <td class="bus-cell" title="${item.direction}">${item.direction}</td>
                        <td class="bus-cell" title="${item.stopName}">${item.stopName}</td>
                        <td class="bus-cell">${renderEtaBadges(item.etas)}</td>
                    `;
                    tableBody.appendChild(tr);
                });
            });
        }

        function startSecondsCounter() {
            if (counterInterval) clearInterval(counterInterval);
            counterInterval = setInterval(() => {
                secondsSinceLastRefresh++;
                document.getElementById('update-counter').textContent = `更新: ${secondsSinceLastRefresh}秒前`;
            }, 1000);
        }

        window.onload = function () {
            parseInputDataSet();
            fetchHKPublicHolidays();
            refreshAllBusEtas();

            startSecondsCounter();

            // Background silent refresh every 10 seconds
            setInterval(refreshAllBusEtas, 10000);
        };
    </script>
</body>
</html>
