<!DOCTYPE html>
<!-- https://cheungbx.github.io/hkbusetaurl/ -->
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>交通 ETA v4.5</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --bg-soft: #f7f7f5;
      --bg-card: #ffffff;
      --border: #e8e8e4;
      --border-strong: #d4d4d0;
      --text: #2c2c2a;
      --text-secondary: #6b6b66;
      --text-muted: #9a9a94;
      --route-bg: #2c2c2a;
      --route-text: #ffffff;
      --eta-soon: #b54a3a;
      --eta-mid: #c47a3a;
      --eta-later: #5a7a5a;
      --district-bg: #f2f2ef;
      --district-text: #5a5a55;
      --tint-ycs: #fafaf8;
      --tint-ycs-head: #f2f2ef;
      --tint-np: #f8f9fb;
      --tint-np-head: #eef1f5;
      --tint-kc: #f8faf8;
      --tint-kc-head: #eef2ee;
      --row-alt: #f0f0ec;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 15px;
      line-height: 1.45;
      min-height: 100vh;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 14px 12px 32px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    @media (min-width: 640px) {
      .page { padding: 20px 18px 40px; gap: 22px; }
    }

    @media (min-width: 900px) {
      .page { padding: 28px 24px 48px; gap: 26px; }
    }

    @media (max-height: 500px) and (orientation: landscape) {
      .page { padding: 10px 14px 20px; gap: 12px; }
      .site-header { padding-bottom: 8px; }
    }

    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }

    .site-title {
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      color: var(--text);
      line-height: 1.3;
    }

    .site-meta { text-align: right; flex-shrink: 0; }

    .timestamp {
      font-size: 0.88rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .update-counter {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 2px;
      letter-spacing: 0.02em;
    }

    .bus-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .bus-section[hidden] { display: none !important; }

    .bus-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .bus-title {
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--text);
      letter-spacing: 0.02em;
    }

    .bus-table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
    }

    .bus-table th {
      background: var(--bg-soft);
      color: var(--text-muted);
      padding: 8px 10px;
      font-weight: 500;
      font-size: 0.76rem;
      border-bottom: 1px solid var(--border);
      text-align: left;
      white-space: nowrap;
      letter-spacing: 0.02em;
    }

    .col-route { width: 22%; }
    .col-dir   { width: 38%; }
    .col-eta   { width: 40%; }

    .col-headers th {
      background: var(--bg-soft) !important;
      color: var(--text-muted) !important;
    }

    .section-title-row th {
      font-weight: 600;
      font-size: 0.92rem;
      color: #ffffff !important;
      padding: 12px 10px 8px;
      letter-spacing: 0.02em;
      border-top: none;
      border-bottom: 1px solid var(--border);
      text-align: left;
      background: #4a4a46 !important;
    }

    .section-block-ycs .section-title-row th { background: #3f3f3b !important; }
    .section-block-np .section-title-row th { background: #3a424c !important; }
    .section-block-kc .section-title-row th { background: #3a453a !important; }

    .district-header-row th {
      background: var(--district-bg) !important;
      color: var(--district-text) !important;
      font-weight: 500;
      font-size: 0.8rem;
      padding: 7px 10px;
      text-align: left;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      letter-spacing: 0.03em;
    }

    .table-spacer-row td {
      padding: 0;
      height: 10px;
      border: none;
      background: transparent;
      line-height: 0;
    }

    .section-block-ycs .district-header-row th { background: var(--tint-ycs-head) !important; }
    .section-block-ycs .bus-row { background-color: #ffffff; }
    .section-block-ycs .bus-row.row-alt { background-color: #ebebe6; }

    .section-block-np .district-header-row th { background: var(--tint-np-head) !important; }
    .section-block-np .bus-row { background-color: #ffffff; }
    .section-block-np .bus-row.row-alt { background-color: #e8ecf2; }

    .section-block-kc .district-header-row th { background: var(--tint-kc-head) !important; }
    .section-block-kc .bus-row { background-color: #ffffff; }
    .section-block-kc .bus-row.row-alt { background-color: #e8eee8; }

    .bus-row { border-bottom: 1px solid var(--border); background-color: #ffffff; }
    .bus-row:last-child { border-bottom: none; }

    .bus-cell {
      padding: 8px 10px;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: middle;
      font-size: 0.88rem;
    }

    .badge-route {
      display: inline-block;
      background-color: var(--route-bg);
      color: var(--route-text);
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 2px;
      font-size: 0.82rem;
      letter-spacing: 0.03em;
    }

    .eta-container {
      display: flex;
      gap: 5px;
      flex-wrap: nowrap;
      overflow: hidden;
    }

    .badge-eta {
      display: inline-block;
      color: #fff;
      font-weight: 500;
      padding: 2px 7px;
      border-radius: 2px;
      font-size: 0.78rem;
      min-width: 30px;
      text-align: center;
      letter-spacing: 0.01em;
    }

    .eta-soon  { background-color: var(--eta-soon); }
    .eta-mid   { background-color: var(--eta-mid); }
    .eta-later { background-color: var(--eta-later); }

    .no-data-msg {
      color: var(--text-muted);
      font-size: 0.78rem;
      font-style: italic;
    }

    .page-footer {
      margin-top: 4px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      font-size: 0.7rem;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.6;
    }

    .page-footer a {
      color: var(--text-secondary);
      text-decoration: none;
    }

    html, body { overflow-x: hidden; }
  </style>
</head>
<body>
  <div class="page">

    <header class="site-header">
      <div class="site-title">交通 ETA <span style="font-size:0.72rem;color:var(--text-muted);font-weight:400;">v4.4</span></div>
      <div class="site-meta">
        <div class="timestamp" id="header-timestamp">—</div>
        <div class="update-counter" id="update-counter">更新: 0秒前</div>
      </div>
    </header>

    <table class="bus-table" id="main-bus-table">
      <thead>
        <tr class="col-headers">
          <th class="col-route">路線</th>
          <th class="col-dir">開往</th>
          <th class="col-eta">分鐘</th>
        </tr>
      </thead>
      <tbody id="bus-table-body"></tbody>
    </table>

    <footer class="page-footer">
      巴士：KMB / GMB / 邨巴時刻表 · v4.4
    </footer>
  </div>

  <script>
    const BUS_DATA_RAW = `
KMB 38 平田 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/C3672D8D28801773/38/1 觀塘區
KMB 38P 平田 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/C3672D8D28801773/38P/1 觀塘區
KMB 40P 觀塘碼頭 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/C3672D8D28801773/40P/1 觀塘區
KMB 42C 藍田站 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/C3672D8D28801773/42C/1 觀塘區
KMB X42P 藍田站 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/C3672D8D28801773/X42P/1 觀塘區
KMB 31B 奧運站 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/C3672D8D28801773/31B/1 油尖旺區
KMB 32 奧運站 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/C3672D8D28801773/32/1 油尖旺區
KMB 35A 尖沙咀東 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/C3672D8D28801773/35A/1 油尖旺區
KMB 35X 尖沙咀東 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/C3672D8D28801773/35X/1 油尖旺區
KMB 36B 高鐵西九龍站 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/C3672D8D28801773/36B/1 油尖旺區
KMB 36X 尖沙咀東麼地道 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/C3672D8D28801773/36X/1 油尖旺區
KMB A30 機場及港珠澳大橋 石排街嘉翠園 https://data.etabus.gov.hk/v1/transport/kmb/eta/BEA270261C1E0D73/A30/1 新界離島區
KMB 936 銅鑼灣棉花路 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/8CF45DD1D6B1FA4D/936/1 港島區
KMB 936A 銅鑼灣棉花路 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/8CF45DD1D6B1FA4D/936A/1 港島區
KMB 40X 烏溪沙站 葵興站 https://data.etabus.gov.hk/v1/transport/kmb/eta/4626B2F2CF370D72/40X/1 沙田區
屋苑 嘉翠園邨巴 葵涌廣場 停車場 SCHEDULE_GREENKNOLL 嘉翠園邨巴
KMB NA30 港珠 石排  https://data.etabus.gov.hk/v1/transport/kmb/eta/BEA270261C1E0D73/NA30/1 新界離島區
GMB 86 荃灣 石籬  https://data.etagmb.gov.hk/eta/route-stop/2008591/2/1 荃灣區
GMB 86M 荃灣 石籬  https://data.etagmb.gov.hk/eta/route-stop/2008594/2/1 荃灣區
GMB 403 沙田 梨貝  https://data.etagmb.gov.hk/eta/route-stop/2001266/1/1 沙田區
GMB 403P 沙田 梨貝  https://data.etagmb.gov.hk/eta/route-stop/2001267/1/1 沙田區
KMB 38P 平田 葵涌業成  https://data.etabus.gov.hk/v1/transport/kmb/eta/8956F5FA7B620297/38P/1 觀塘區


KMB 38 葵盛(東) 觀塘駿業里  https://data.etabus.gov.hk/v1/transport/kmb/eta/84B384771F1CE484/38/1 葵涌APM
KMB 40P 荃灣 觀塘駿業里  https://data.etabus.gov.hk/v1/transport/kmb/eta/84B384771F1CE484/40P/1 葵涌APM
KMB 42C 青衣(長亨邨) 觀塘駿業里  https://data.etabus.gov.hk/v1/transport/kmb/eta/84B384771F1CE484/42C/1 葵涌APM

KMB 38 葵盛(東) 觀塘轉車站 https://data.etabus.gov.hk/v1/transport/kmb/eta/671775E6AF279B42/38/1 葵涌SiS
KMB 40P 荃灣 觀塘轉車站 https://data.etabus.gov.hk/v1/transport/kmb/eta/671775E6AF279B42/40P/1 葵涌SiS
KMB 42C 青衣(長亨邨) 觀塘轉車站 https://data.etabus.gov.hk/v1/transport/kmb/eta/671775E6AF279B42/42C/1 葵涌SiS

KMB 601 金鐘 觀塘游泳池  https://data.etabus.gov.hk/v1/transport/kmb/eta/5AAC6A858427D04E/601/1 北角
KMB 619 中環 觀塘游泳池  https://data.etabus.gov.hk/v1/transport/kmb/eta/5AAC6A858427D04E/619/1 北角

    `.trim();

    const GREENKNOLL_SCHEDULE = {
      weekday: [
        "07:30", "07:50", "08:15", "08:35", "09:00", "09:30",
        "10:30", "11:00", "11:30", "12:00",
        "14:00", "14:30", "15:00", "15:30",
        "17:00", "17:30", "18:00", "18:30", "19:00", "19:30", "20:00", "20:30", "21:00"
      ],
      holiday: [
        "08:00", "08:30", "09:00", "09:30",
        "10:30", "11:00", "11:30",
        "13:30", "14:00", "14:30", "15:00", "15:30",
        "17:00", "17:30", "18:00", "18:30", "19:00", "19:30", "20:00", "20:30", "21:00"
      ]
    };

    const DISTRICT_LABEL = {
      '📍 葵涌APM': '📍 葵涌 APM',
      '📍 葵涌SiS': '📍 葵涌 SiS',
    };

    const SECTION_CONFIG = [
      {
        id: 'ycs',
        title: '業成街',
        blockClass: 'section-block-ycs',
        showDistrictHeaders: true,
        districts: [
          '📍 觀塘區',
          '📍 油尖旺區',
          '📍 新界離島區',
          '📍 港島區',
          '📍 沙田區',
          '📍 荃灣區',
          '📍 嘉翠園邨巴',
        ],
      },
      {
        id: 'np',
        title: '北角',
        blockClass: 'section-block-np',
        showDistrictHeaders: false,
        districts: ['📍 北角'],
      },
      {
        id: 'kc',
        title: '葵涌',
        blockClass: 'section-block-kc',
        showDistrictHeaders: true,
        districts: ['📍 葵涌APM', '📍 葵涌SiS'],
      },
    ];

    let parsedRoutes = [];
    let hkPublicHolidays = new Set();
    let secondsSinceLastRefresh = 0;
    let counterInterval = null;

    function parseInputDataSet() {
      parsedRoutes = [];
      BUS_DATA_RAW.split('\n').forEach(line => {
        const parts = line.trim().split(/\s+/);
        if (parts.length >= 6) {
          const [busCoId, route, direction, stopName, targetSrc, district] = parts;
          const formattedDistrict = district.startsWith('📍') ? district : `📍 ${district}`;
          parsedRoutes.push({ busCoId, route, direction, stopName, targetSrc, district: formattedDistrict });
        }
      });
    }

    async function fetchHKPublicHolidays() {
      try {
        const res = await fetch('https://www.1823.gov.hk/common/ical/en.json');
        if (res.ok) {
          const data = await res.json();
          if (data?.vcalendar?.[0]?.vevent) {
            data.vcalendar[0].vevent.forEach(event => {
              if (event.dtstart?.[0]) hkPublicHolidays.add(event.dtstart[0]);
            });
          }
        }
      } catch (err) {
        console.warn('Could not fetch public holidays:', err);
      }
    }

    function getFormattedHKTimestamp(now) {
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const min = String(now.getMinutes()).padStart(2, '0');
      return `${yyyy}.${mm}.${dd}  ${hh}:${min}`;
    }

    function isTodayHolidayOrSunday(now) {
      if (now.getDay() === 0) return true;
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      return hkPublicHolidays.has(`${yyyy}${mm}${dd}`);
    }

    function calculateShuttleEtas(now) {
      const isHoliday = isTodayHolidayOrSunday(now);
      const scheduleList = isHoliday ? GREENKNOLL_SCHEDULE.holiday : GREENKNOLL_SCHEDULE.weekday;
      const currentMinutesOfDay = now.getHours() * 60 + now.getMinutes();
      const upcoming = [];
      for (const timeStr of scheduleList) {
        const [h, m] = timeStr.split(':').map(Number);
        const diffMin = (h * 60 + m) - currentMinutesOfDay;
        if (diffMin >= 0) {
          upcoming.push(diffMin);
          if (upcoming.length === 3) break;
        }
      }
      return upcoming;
    }

    async function fetchRouteEta(routeObj) {
      const now = new Date();
      if (routeObj.targetSrc === 'SCHEDULE_GREENKNOLL') {
        return calculateShuttleEtas(now);
      }
      if (!routeObj.targetSrc.startsWith('https://')) return [];

      try {
        const response = await fetch(routeObj.targetSrc);
        if (!response.ok) return [];
        const json = await response.json();
        let etaArr = [];

        if (routeObj.busCoId === 'GMB') {
          if (json?.data?.eta && Array.isArray(json.data.eta)) {
            etaArr = json.data.eta.map(item => item.diff).filter(diff => diff >= 0);
          }
        } else {
          if (json?.data && Array.isArray(json.data)) {
            etaArr = json.data
              .filter(item => item.eta)
              .map(item => Math.floor((new Date(item.eta) - now) / 60000))
              .filter(diff => diff >= 0);
          }
        }
        return etaArr.sort((a, b) => a - b).slice(0, 3);
      } catch (err) {
        console.warn(`Failed to fetch ETA for ${routeObj.route}:`, err);
        return [];
      }
    }

    function renderEtaBadges(minutesArr) {
      if (!minutesArr || minutesArr.length === 0) {
        return `<span class="no-data-msg">尾班車已開出</span>`;
      }
      return `<div class="eta-container">` + minutesArr.map(min => {
        let colorClass = 'eta-later';
        if (min < 9) colorClass = 'eta-soon';
        else if (min <= 15) colorClass = 'eta-mid';
        const displayText = min === 0 ? '即將' : `${min}分`;
        return `<span class="badge-eta ${colorClass}">${displayText}</span>`;
      }).join('') + `</div>`;
    }

    function appendRouteRow(tbody, item, alt, blockClass) {
      const tr = document.createElement('tr');
      tr.className = 'bus-row ' + blockClass + (alt ? ' row-alt' : '');
      tr.innerHTML = `
        <td class="bus-cell"><span class="badge-route">${item.route}</span></td>
        <td class="bus-cell" title="${item.direction}">${item.direction}</td>
        <td class="bus-cell">${renderEtaBadges(item.etas)}</td>
      `;
      tbody.appendChild(tr);
    }

    function appendSpacerRow(tbody, count = 1) {
      for (let i = 0; i < count; i++) {
        const tr = document.createElement('tr');
        tr.className = 'table-spacer-row';
        tr.innerHTML = '<td colspan="3"></td>';
        tbody.appendChild(tr);
      }
    }

    async function refreshAllBusEtas() {
      const now = new Date();
      document.getElementById('header-timestamp').textContent = getFormattedHKTimestamp(now);
      secondsSinceLastRefresh = 0;
      document.getElementById('update-counter').textContent = `更新: 0秒前`;

      const routeResults = await Promise.all(
        parsedRoutes.map(async routeObj => ({
          ...routeObj,
          etas: await fetchRouteEta(routeObj)
        }))
      );

      const groupedByDistrict = {};
      routeResults.forEach(item => {
        if (!groupedByDistrict[item.district]) groupedByDistrict[item.district] = [];
        groupedByDistrict[item.district].push(item);
      });

      const tbody = document.getElementById('bus-table-body');
      tbody.innerHTML = '';

      let headerSpacersDone = false;
      let firstSection = true;

      SECTION_CONFIG.forEach((cfg) => {
        const activeByDistrict = [];
        cfg.districts.forEach(districtName => {
          const routes = (groupedByDistrict[districtName] || []).filter(r => r.etas && r.etas.length > 0);
          if (routes.length) activeByDistrict.push({ districtName, routes });
        });
        if (activeByDistrict.length === 0) return;

        if (!headerSpacersDone) {
          appendSpacerRow(tbody, 5);
          headerSpacersDone = true;
        } else if (!firstSection) {
          appendSpacerRow(tbody, 1);
        }
        firstSection = false;

        const titleTr = document.createElement('tr');
        titleTr.className = 'section-title-row ' + cfg.blockClass;
        titleTr.innerHTML = `<th colspan="3">${cfg.title}</th>`;
        tbody.appendChild(titleTr);

        appendSpacerRow(tbody, 1);

        activeByDistrict.forEach(({ districtName, routes }) => {
          if (cfg.showDistrictHeaders) {
            const label = DISTRICT_LABEL[districtName] || districtName;
            const headerTr = document.createElement('tr');
            headerTr.className = 'district-header-row ' + cfg.blockClass;
            headerTr.innerHTML = `<th colspan="3">${label}</th>`;
            tbody.appendChild(headerTr);
          }
          routes.forEach((item, i) => appendRouteRow(tbody, item, i % 2 === 1, cfg.blockClass));
        });
      });
    }

    function startSecondsCounter() {
      if (counterInterval) clearInterval(counterInterval);
      counterInterval = setInterval(() => {
        secondsSinceLastRefresh++;
        document.getElementById('update-counter').textContent = `更新: ${secondsSinceLastRefresh}秒前`;
      }, 1000);
    }

    window.onload = async function () {
      parseInputDataSet();
      await fetchHKPublicHolidays();
      refreshAllBusEtas();
      startSecondsCounter();
      setInterval(refreshAllBusEtas, 10000);
    };
  </script>
</body>
</html>
