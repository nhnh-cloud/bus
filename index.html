<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>嘉翠園 · 天氣 &amp; 交通 v3.7</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* MUJI-inspired neutral palette */
      --bg: #ffffff;
      --bg-soft: #f7f7f5;
      --bg-card: #ffffff;
      --border: #e8e8e4;
      --border-strong: #d4d4d0;
      --text: #2c2c2a;
      --text-secondary: #6b6b66;
      --text-muted: #9a9a94;
      --accent: #7a7a74;
      --route-bg: #2c2c2a;
      --route-text: #ffffff;
      --eta-soon: #b54a3a;
      --eta-mid: #c47a3a;
      --eta-later: #5a7a5a;
      --district-bg: #f2f2ef;
      --district-text: #5a5a55;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 15px;
      line-height: 1.45;
      min-height: 100vh;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }

    /* ========== LAYOUT ========== */
    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 14px 12px 32px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    @media (min-width: 640px) {
      .page {
        padding: 20px 18px 40px;
        gap: 22px;
      }
    }

    @media (min-width: 900px) {
      .page {
        padding: 28px 24px 48px;
        gap: 26px;
      }
    }

    /* Landscape phone: tighter vertical spacing */
    @media (max-height: 500px) and (orientation: landscape) {
      .page {
        padding: 10px 14px 20px;
        gap: 12px;
      }
      .site-header {
        padding-bottom: 8px;
      }
      .weather-section {
        padding: 12px 14px !important;
      }
      .forecast-3day {
        margin-top: 10px !important;
        padding-top: 10px !important;
      }
    }

    /* ========== HEADER ========== */
    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }

    .site-title {
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      color: var(--text);
      line-height: 1.3;
    }

    .site-meta {
      text-align: right;
      flex-shrink: 0;
    }

    .timestamp {
      font-size: 0.88rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .update-counter {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 2px;
      letter-spacing: 0.02em;
    }

    /* ========== WEATHER SECTION ========== */
    .weather-section {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 16px 14px;
    }

    @media (min-width: 640px) {
      .weather-section {
        padding: 18px 20px;
      }
    }

    .weather-top {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .weather-temp-block {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .weather-temp {
      font-size: 2.8rem;
      font-weight: 300;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--text);
    }

    .weather-temp span {
      font-size: 1.25rem;
      vertical-align: super;
      margin-left: 1px;
    }

    .weather-icon {
      width: 48px;
      height: 48px;
      object-fit: contain;
      opacity: 0.92;
    }

    .weather-info {
      flex: 1;
      min-width: 140px;
    }

    .weather-desc {
      font-size: 0.92rem;
      color: var(--text);
      line-height: 1.4;
      margin-bottom: 3px;
    }

    .weather-range {
      font-size: 0.82rem;
      color: var(--text-secondary);
    }

    .weather-stats {
      display: flex;
      gap: 16px;
      margin-left: auto;
      font-size: 0.82rem;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .weather-stats strong {
      color: var(--text);
      font-weight: 500;
      margin-left: 3px;
    }

    @media (max-width: 520px) {
      .weather-stats {
        width: 100%;
        margin-left: 0;
        margin-top: 10px;
        justify-content: flex-start;
      }
    }

    /* 3-day forecast strip */
    .forecast-3day {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .day-card {
      text-align: center;
      padding: 6px 4px;
    }

    .day-name {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      letter-spacing: 0.02em;
    }

    .day-icon {
      width: 32px;
      height: 32px;
      object-fit: contain;
      margin: 0 auto 4px;
      display: block;
      opacity: 0.9;
    }

    .day-temps {
      font-size: 0.82rem;
      color: var(--text);
      font-weight: 400;
      letter-spacing: 0.01em;
    }

    .day-psr {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .weather-footer {
      margin-top: 12px;
      font-size: 0.72rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .weather-footer a {
      color: var(--text-secondary);
      text-decoration: none;
      border-bottom: 1px solid var(--border-strong);
    }

    .weather-footer a:hover {
      color: var(--text);
    }

    .loading-weather, .error-weather {
      text-align: center;
      padding: 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* ========== BUS SECTION ========== */
    .bus-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .bus-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .bus-title {
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--text);
      letter-spacing: 0.02em;
    }

    /* Table – 3 columns only */
    .bus-table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
    }

    .bus-table th {
      background: var(--bg-soft);
      color: var(--text-muted);
      padding: 8px 10px;
      font-weight: 500;
      font-size: 0.76rem;
      border-bottom: 1px solid var(--border);
      text-align: left;
      white-space: nowrap;
      letter-spacing: 0.02em;
    }

    .col-route { width: 22%; }
    .col-dir   { width: 38%; }
    .col-eta   { width: 40%; }

    .district-header-row th {
      background: var(--district-bg) !important;
      color: var(--district-text) !important;
      font-weight: 500;
      font-size: 0.8rem;
      padding: 7px 10px;
      text-align: left;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      letter-spacing: 0.03em;
    }

    .bus-row {
      border-bottom: 1px solid var(--border);
    }

    .bus-row:last-child {
      border-bottom: none;
    }

    .bus-row:nth-child(even) {
      background-color: #fafaf8;
    }

    .bus-cell {
      padding: 8px 10px;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: middle;
      font-size: 0.88rem;
    }

    .badge-route {
      display: inline-block;
      background-color: var(--route-bg);
      color: var(--route-text);
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 2px;
      font-size: 0.82rem;
      letter-spacing: 0.03em;
    }

    .eta-container {
      display: flex;
      gap: 5px;
      flex-wrap: nowrap;
      overflow: hidden;
    }

    .badge-eta {
      display: inline-block;
      color: #fff;
      font-weight: 500;
      padding: 2px 7px;
      border-radius: 2px;
      font-size: 0.78rem;
      min-width: 30px;
      text-align: center;
      letter-spacing: 0.01em;
    }

    .eta-soon  { background-color: var(--eta-soon); }
    .eta-mid   { background-color: var(--eta-mid); }
    .eta-later { background-color: var(--eta-later); }

    .no-data-msg {
      color: var(--text-muted);
      font-size: 0.78rem;
      font-style: italic;
    }

    /* Footer – minimal */
    .page-footer {
      margin-top: 4px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      font-size: 0.7rem;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.6;
    }

    .page-footer a {
      color: var(--text-secondary);
      text-decoration: none;
    }

    /* Prevent horizontal overflow */
    html, body {
      overflow-x: hidden;
    }
  </style>
</head>
<body>
  <div class="page">

    <!-- Header -->
    <header class="site-header">
      <div class="site-title">嘉翠園 · 天氣 &amp; 交通</div>
      <div class="site-meta">
        <div class="timestamp" id="header-timestamp">—</div>
        <div class="update-counter" id="update-counter">更新: 0秒前</div>
      </div>
    </header>

    <!-- Weather -->
    <section class="weather-section" id="weather-section">
      <div class="loading-weather">正在載入天氣資料…</div>
    </section>

    <!-- Bus ETA -->
    <section class="bus-section">
      <div class="bus-header">
        <div class="bus-title">嘉翠業成街 交通 ETA</div>
      </div>

      <table class="bus-table">
        <thead>
          <tr>
            <th class="col-route">路線</th>
            <th class="col-dir">開往</th>
            <th class="col-eta">分鐘</th>
          </tr>
        </thead>
        <tbody id="bus-table-body"></tbody>
      </table>
    </section>

    <footer class="page-footer">
      天氣：<a href="https://www.hko.gov.hk" target="_blank">香港天文台</a>　·　巴士：KMB / 邨巴時刻表
    </footer>
  </div>

  <script>
    /* ============================================================
       WEATHER (HKO)
       ============================================================ */
    const API_BASE = 'https://data.weather.gov.hk/weatherAPI/opendata/weather.php';

    async function fetchJSON(dataType) {
      const res = await fetch(`${API_BASE}?dataType=${dataType}&lang=tc`);
      if (!res.ok) throw new Error(`API error: ${res.status}`);
      return res.json();
    }

    function getIconUrl(code) {
      return `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${code}.png`;
    }

    function formatWeatherTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return d.toLocaleString('zh-HK', {
        month: 'numeric', day: 'numeric',
        hour: '2-digit', minute: '2-digit', hour12: false
      });
    }

    async function loadWeather() {
      const section = document.getElementById('weather-section');
      try {
        const [rhr, flw, fnd] = await Promise.all([
          fetchJSON('rhrread'),
          fetchJSON('flw'),
          fetchJSON('fnd')
        ]);

        const tempData = rhr.temperature?.data || [];
        const hkoTemp = tempData.find(t => t.place === '香港天文台') || tempData[0];
        const currentTemp = hkoTemp ? hkoTemp.value : '--';

        // Live relative humidity from HKO
        const humidity = rhr.humidity?.data?.[0]?.value ?? '--';

        const iconCode = (rhr.icon && rhr.icon[0]) || 60;
        const iconUrl = getIconUrl(iconCode);
        const forecastDesc = flw.forecastDesc || flw.generalSituation || '暫無資料';

        // Observed station extremes so far today
        const temps = tempData.map(t => t.value).filter(v => typeof v === 'number');
        const observedMin = temps.length ? Math.min(...temps) : null;
        const observedMax = temps.length ? Math.max(...temps) : null;

        const forecasts = fnd.weatherForecast || [];
        const first = forecasts[0] || {};
        const forecastMin = first.forecastMintemp?.value ?? null;
        const forecastMax = first.forecastMaxtemp?.value ?? null;
        const psr = first.PSR || '—';

        // Today range logic:
        // - If fnd still has today → use official forecast min/max as 「今日預溫度測預测」
        // - Otherwise (after midday) → show observed range as 「今日溫度預测」
        const today = new Date();
        const todayStr = today.getFullYear() +
          String(today.getMonth() + 1).padStart(2, '0') +
          String(today.getDate()).padStart(2, '0');
        const firstIsToday = first.forecastDate === todayStr;

        let rangeLabel, rangeText;
        if (firstIsToday && forecastMin != null && forecastMax != null) {
          rangeLabel = '今日預測';
          rangeText = `${forecastMin} – ${forecastMax}°C`;
        } else if (observedMin != null && observedMax != null) {
          rangeLabel = '香港氣溫預測介乎約';
          rangeText = `${observedMin} – ${observedMax}°C`;
        } else if (forecastMin != null && forecastMax != null) {
          rangeLabel = first.week ? `${first.week}預測` : '預測';
          rangeText = `${forecastMin} – ${forecastMax}°C`;
        } else {
          rangeLabel = '今日預測';
          rangeText = '– – –';
        }

        // Next 3 days
        const daysHtml = forecasts.slice(0, 3).map(day => {
          const icon = day.ForecastIcon || 60;
          const hi = day.forecastMaxtemp?.value ?? '–';
          const lo = day.forecastMintemp?.value ?? '–';
          const dayPsr = day.PSR || '';
          return `
            <div class="day-card">
              <div class="day-name">${day.week || ''}</div>
              <img class="day-icon" src="${getIconUrl(icon)}" alt=""
                   onerror="this.src='https://www.hko.gov.hk/images/wxicon/pic${icon}.png'">
              <div class="day-temps">${lo}° / ${hi}°</div>
              <div class="day-psr">${dayPsr}</div>
            </div>
          `;
        }).join('');

        const updateTime = formatWeatherTime(rhr.updateTime || flw.updateTime);

        section.innerHTML = `
          <div class="weather-top">
            <div class="weather-temp-block">
              <div class="weather-temp">${currentTemp}<span>°</span></div>
              <img class="weather-icon" src="${iconUrl}" alt="天氣圖示"
                   onerror="this.src='https://www.hko.gov.hk/images/wxicon/pic${iconCode}.png'">
            </div>
            <div class="weather-info">
              <div class="weather-desc">${forecastDesc}</div>
              <div class="weather-range">${rangeLabel}：${rangeText}</div>
            </div>
            <div class="weather-stats">
              <span>相對濕度 <strong>${humidity}%</strong></span>
              <span>降雨概率 <strong>${psr}</strong></span>
            </div>
          </div>

          <div class="forecast-3day">
            ${daysHtml}
          </div>

          <div class="weather-footer">
            <span>更新：${updateTime}</span>
            <a href="https://www.hko.gov.hk/tc/wxinfo/currwx/fnd.htm" target="_blank">每時預報 →</a>
          </div>
        `;
      } catch (err) {
        console.error(err);
        section.innerHTML = `
          <div class="error-weather">
            無法載入天氣資料 · <a href="javascript:location.reload()" style="color:var(--text-secondary)">重新載入</a>
          </div>
        `;
      }
    }

    /* ============================================================
       BUS ETA
       ============================================================ */
    const BUS_DATA_RAW = `
MB 38 平田 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/C3672D8D28801773/38/1 觀塘區
KMB 38P 平田 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/C3672D8D28801773/38P/1 觀塘區
KMB 40P 觀塘碼頭 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/C3672D8D28801773/40P/1 觀塘區
KMB 42C 藍田站 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/C3672D8D28801773/42C/1 觀塘區
KMB X42P 藍田站 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/C3672D8D28801773/X42P/1 觀塘區
KMB 31B 奧運站 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/C3672D8D28801773/31B/1 油尖旺區
KMB 32 奧運站 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/C3672D8D28801773/32/1 油尖旺區
KMB 35A 尖沙咀東 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/C3672D8D28801773/35A/1 油尖旺區
KMB 35X 尖沙咀東 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/C3672D8D28801773/35X/1 油尖旺區
KMB 36B 高鐵西九龍站 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/C3672D8D28801773/36B/1 油尖旺區
KMB 36X 尖沙咀東麼地道 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/C3672D8D28801773/36X/1 油尖旺區
KMB A30 機場及港珠澳大橋 石排街嘉翠園 https://data.etabus.gov.hk/v1/transport/kmb/eta/BEA270261C1E0D73/A30/1 新界離島區
KMB 936 銅鑼灣棉花路 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/8CF45DD1D6B1FA4D/936/1 港島區
KMB 936A 銅鑼灣棉花路 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/8CF45DD1D6B1FA4D/936A/1 港島區
KMB 40X 烏溪沙站 葵興站 https://data.etabus.gov.hk/v1/transport/kmb/eta/4626B2F2CF370D72/40X/1 沙田區
屋苑 嘉翠園邨巴 葵涌廣場 停車場 SCHEDULE_GREENKNOLL 嘉翠園邨巴
KMB NA30 港珠 石排  https://data.etabus.gov.hk/v1/transport/kmb/eta/BEA270261C1E0D73/NA30/1 新界離島區
GMB 86 荃灣 石籬  https://data.etagmb.gov.hk/eta/route-stop/2008591/2/1 荃灣區
GMB 86M 荃灣 石籬  https://data.etagmb.gov.hk/eta/route-stop/2008594/2/1 荃灣區
GMB 403 沙田 梨貝  https://data.etagmb.gov.hk/eta/route-stop/2001266/1/1 沙田區
GMB 403P 沙田 梨貝  https://data.etagmb.gov.hk/eta/route-stop/2001267/1/1 沙田區


    `.trim();

    const GREENKNOLL_SCHEDULE = {
      weekday: [
        "07:30", "07:50", "08:15", "08:35", "09:00", "09:30",
        "10:30", "11:00", "11:30", "12:00",
        "14:00", "14:30", "15:00", "15:30",
        "17:00", "17:30", "18:00", "18:30", "19:00", "19:30", "20:00", "20:30", "21:00"
      ],
      holiday: [
        "08:00", "08:30", "09:00", "09:30",
        "10:30", "11:00", "11:30",
        "13:30", "14:00", "14:30", "15:00", "15:30",
        "17:00", "17:30", "18:00", "18:30", "19:00", "19:30", "20:00", "20:30", "21:00"
      ]
    };
荃灣區
    const DISTRICT_ORDER = [
      '📍 觀塘區',
      '📍 油尖旺區',
      '📍 新界離島區',
      '📍 港島區',
      '📍 沙田區',
	  '📍 荃灣區',
      '📍 嘉翠園邨巴',
    ];

    let parsedRoutes = [];
    let hkPublicHolidays = new Set();
    let secondsSinceLastRefresh = 0;
    let counterInterval = null;

    function parseInputDataSet() {
      parsedRoutes = [];
      BUS_DATA_RAW.split('\n').forEach(line => {
        const parts = line.trim().split(/\s+/);
        if (parts.length >= 6) {
          const [busCoId, route, direction, stopName, targetSrc, district] = parts;
          const formattedDistrict = district.startsWith('📍') ? district : `📍 ${district}`;
          parsedRoutes.push({ busCoId, route, direction, stopName, targetSrc, district: formattedDistrict });
        }
      });
    }

    async function fetchHKPublicHolidays() {
      try {
        const res = await fetch('https://www.1823.gov.hk/common/ical/en.json');
        if (res.ok) {
          const data = await res.json();
          if (data?.vcalendar?.[0]?.vevent) {
            data.vcalendar[0].vevent.forEach(event => {
              if (event.dtstart?.[0]) hkPublicHolidays.add(event.dtstart[0]);
            });
          }
        }
      } catch (err) {
        console.warn('Could not fetch public holidays:', err);
      }
    }

    function getFormattedHKTimestamp(now) {
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const min = String(now.getMinutes()).padStart(2, '0');
      return `${yyyy}.${mm}.${dd}  ${hh}:${min}`;
    }

    function isTodayHolidayOrSunday(now) {
      if (now.getDay() === 0) return true;
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      return hkPublicHolidays.has(`${yyyy}${mm}${dd}`);
    }

    function calculateShuttleEtas(now) {
      const isHoliday = isTodayHolidayOrSunday(now);
      const scheduleList = isHoliday ? GREENKNOLL_SCHEDULE.holiday : GREENKNOLL_SCHEDULE.weekday;
      const currentMinutesOfDay = now.getHours() * 60 + now.getMinutes();
      const upcoming = [];
      for (const timeStr of scheduleList) {
        const [h, m] = timeStr.split(':').map(Number);
        const diffMin = (h * 60 + m) - currentMinutesOfDay;
        if (diffMin >= 0) {
          upcoming.push(diffMin);
          if (upcoming.length === 3) break;
        }
      }
      return upcoming;
    }

    async function fetchRouteEta(routeObj) {
      const now = new Date();
      if (routeObj.targetSrc === 'SCHEDULE_GREENKNOLL') {
        return calculateShuttleEtas(now);
      }
      if (!routeObj.targetSrc.startsWith('https://')) return [];

      try {
        const response = await fetch(routeObj.targetSrc);
        if (!response.ok) return [];
        const json = await response.json();
        let etaArr = [];

        if (routeObj.busCoId === 'GMB') {
          if (json?.data?.eta && Array.isArray(json.data.eta)) {
            etaArr = json.data.eta.map(item => item.diff).filter(diff => diff >= 0);
          }
        } else {
          if (json?.data && Array.isArray(json.data)) {
            etaArr = json.data
              .filter(item => item.eta)
              .map(item => Math.floor((new Date(item.eta) - now) / 60000))
              .filter(diff => diff >= 0);
          }
        }
        return etaArr.sort((a, b) => a - b).slice(0, 3);
      } catch (err) {
        console.warn(`Failed to fetch ETA for ${routeObj.route}:`, err);
        return [];
      }
    }

    function renderEtaBadges(minutesArr) {
      if (!minutesArr || minutesArr.length === 0) {
        return `<span class="no-data-msg">尾班車已過</span>`;
      }
      return `<div class="eta-container">` + minutesArr.map(min => {
        let colorClass = 'eta-later';
        if (min < 9) colorClass = 'eta-soon';
        else if (min <= 15) colorClass = 'eta-mid';
        const displayText = min === 0 ? '即將' : `${min}分`;
        return `<span class="badge-eta ${colorClass}">${displayText}</span>`;
      }).join('') + `</div>`;
    }

    async function refreshAllBusEtas() {
      const now = new Date();
      document.getElementById('header-timestamp').textContent = getFormattedHKTimestamp(now);
      secondsSinceLastRefresh = 0;
      document.getElementById('update-counter').textContent = `更新: 0秒前`;

      const routeResults = await Promise.all(
        parsedRoutes.map(async routeObj => ({
          ...routeObj,
          etas: await fetchRouteEta(routeObj)
        }))
      );

      const groupedByDistrict = {};
      DISTRICT_ORDER.forEach(dist => { groupedByDistrict[dist] = []; });
      routeResults.forEach(item => {
        if (groupedByDistrict[item.district]) {
          groupedByDistrict[item.district].push(item);
        } else {
          groupedByDistrict[item.district] = [item];
        }
      });

      const tableBody = document.getElementById('bus-table-body');
      tableBody.innerHTML = '';

      DISTRICT_ORDER.forEach(districtName => {
        const districtRoutes = groupedByDistrict[districtName] || [];
        const activeRoutes = districtRoutes.filter(r => r.etas && r.etas.length > 0);
        if (activeRoutes.length === 0) return;

        const headerTr = document.createElement('tr');
        headerTr.className = 'district-header-row';
        headerTr.innerHTML = `<th colspan="3">${districtName}</th>`;
        tableBody.appendChild(headerTr);

        activeRoutes.forEach(item => {
          const tr = document.createElement('tr');
          tr.className = 'bus-row';
          tr.innerHTML = `
            <td class="bus-cell"><span class="badge-route">${item.route}</span></td>
            <td class="bus-cell" title="${item.direction}">${item.direction}</td>
            <td class="bus-cell">${renderEtaBadges(item.etas)}</td>
          `;
          tableBody.appendChild(tr);
        });
      });
    }

    function startSecondsCounter() {
      if (counterInterval) clearInterval(counterInterval);
      counterInterval = setInterval(() => {
        secondsSinceLastRefresh++;
        document.getElementById('update-counter').textContent = `更新: ${secondsSinceLastRefresh}秒前`;
      }, 1000);
    }

    /* ============================================================
       INIT
       ============================================================ */
    window.onload = function () {
      loadWeather();
      parseInputDataSet();
      fetchHKPublicHolidays();
      refreshAllBusEtas();
      startSecondsCounter();
      setInterval(refreshAllBusEtas, 10000);
      setInterval(loadWeather, 10000);
    };
  </script>
</body>
