<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>嘉翠園 · 天氣 &amp; 交通 ETA v3.3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* MUJI-inspired neutral palette */
      --bg: #ffffff;
      --bg-soft: #f7f7f5;
      --bg-card: #ffffff;
      --border: #e8e8e4;
      --border-strong: #d4d4d0;
      --text: #2c2c2a;
      --text-secondary: #6b6b66;
      --text-muted: #9a9a94;
      --accent: #7a7a74;
      --wood: #c4b8a8;
      --route-bg: #2c2c2a;
      --route-text: #ffffff;
      --eta-soon: #b54a3a;      /* soft brick – under 9 min */
      --eta-mid: #c47a3a;       /* warm ochre – 9-15 min */
      --eta-later: #5a7a5a;     /* muted green – >15 min */
      --district-bg: #f0f0ec;
      --district-text: #4a4a46;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 15px;
      line-height: 1.45;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ========== LAYOUT ========== */
    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px 12px 40px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Desktop: weather card + bus side by side-ish, but stacked cleanly */
    @media (min-width: 768px) {
      .page {
        padding: 24px 20px 48px;
        gap: 28px;
      }
    }

    /* ========== HEADER ========== */
    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .site-title {
      font-size: 1.15rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--text);
    }

    .site-meta {
      text-align: right;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .site-meta .timestamp {
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* ========== WEATHER SECTION ========== */
    .weather-section {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 18px 16px;
    }

    @media (min-width: 640px) {
      .weather-section {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 20px;
        align-items: center;
        padding: 20px 24px;
      }
    }

    .weather-main {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .weather-temp {
      font-size: 3.2rem;
      font-weight: 300;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--text);
    }

    .weather-temp span {
      font-size: 1.4rem;
      vertical-align: super;
      margin-left: 1px;
    }

    .weather-icon {
      width: 56px;
      height: 56px;
      object-fit: contain;
      opacity: 0.9;
    }

    .weather-info {
      flex: 1;
    }

    .weather-desc {
      font-size: 0.95rem;
      color: var(--text);
      margin-bottom: 4px;
      line-height: 1.4;
    }

    .weather-range {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .weather-stats {
      display: flex;
      gap: 20px;
      margin-top: 12px;
    }

    @media (min-width: 640px) {
      .weather-stats {
        margin-top: 0;
        flex-direction: column;
        gap: 8px;
        text-align: right;
      }
    }

    .weather-stat {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .weather-stat strong {
      color: var(--text);
      font-weight: 500;
      margin-left: 4px;
    }

    .weather-footer {
      margin-top: 12px;
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .weather-footer a {
      color: var(--text-secondary);
      text-decoration: none;
      border-bottom: 1px solid var(--border-strong);
    }

    .weather-footer a:hover {
      color: var(--text);
    }

    .loading-weather, .error-weather {
      text-align: center;
      padding: 24px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* ========== BUS SECTION ========== */
    .bus-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .bus-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-bottom: 6px;
    }

    .bus-title {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text);
    }

    .update-counter {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Table */
    .bus-table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
    }

    .bus-table th {
      background: var(--bg-soft);
      color: var(--text-muted);
      padding: 8px 8px;
      font-weight: 500;
      font-size: 0.78rem;
      border-bottom: 1px solid var(--border);
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .col-route { width: 18%; }
    .col-dir   { width: 22%; }
    .col-stop  { width: 28%; }
    .col-eta   { width: 32%; }

    .district-header-row th {
      background: var(--district-bg) !important;
      color: var(--district-text) !important;
      font-weight: 500;
      font-size: 0.82rem;
      padding: 7px 10px;
      text-align: left;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      letter-spacing: 0.02em;
    }

    .bus-row {
      border-bottom: 1px solid var(--border);
    }

    .bus-row:last-child {
      border-bottom: none;
    }

    .bus-row:nth-child(even) {
      background-color: #fafaf8;
    }

    .bus-cell {
      padding: 7px 8px;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: middle;
      font-size: 0.88rem;
    }

    /* Route badge – MUJI style (dark neutral) */
    .badge-route {
      display: inline-block;
      background-color: var(--route-bg);
      color: var(--route-text);
      font-weight: 500;
      padding: 2px 7px;
      border-radius: 2px;
      font-size: 0.82rem;
      letter-spacing: 0.02em;
    }

    .eta-container {
      display: flex;
      gap: 5px;
      flex-wrap: nowrap;
      overflow: hidden;
    }

    .badge-eta {
      display: inline-block;
      color: #fff;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: 2px;
      font-size: 0.78rem;
      min-width: 28px;
      text-align: center;
    }

    .eta-soon  { background-color: var(--eta-soon); }
    .eta-mid   { background-color: var(--eta-mid); }
    .eta-later { background-color: var(--eta-later); }

    .no-data-msg {
      color: var(--text-muted);
      font-size: 0.78rem;
      font-style: italic;
    }

    /* Footer */
    .page-footer {
      margin-top: 8px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 0.72rem;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.6;
    }

    .page-footer a {
      color: var(--text-secondary);
      text-decoration: none;
    }

    /* Responsive font scaling for larger screens (keep readable) */
    @media (min-width: 1025px) {
      body { font-size: 14.5px; }
    }
  </style>
</head>
<body>
  <div class="page">

    <!-- Site Header -->
    <header class="site-header">
      <div class="site-title">嘉翠園 · 天氣 &amp; 交通</div>
      <div class="site-meta">
        <div class="timestamp" id="header-timestamp">[--]</div>
        <div class="update-counter" id="update-counter">更新: 0秒前</div>
      </div>
    </header>

    <!-- Weather Card (HKO) -->
    <section class="weather-section" id="weather-section">
      <div class="loading-weather" id="weather-loading">正在載入天氣資料…</div>
    </section>

    <!-- Bus ETA -->
    <section class="bus-section">
      <div class="bus-header">
        <div class="bus-title">嘉翠業成街 交通 ETA</div>
      </div>

      <table class="bus-table">
        <thead>
          <tr>
            <th class="col-route">路線</th>
            <th class="col-dir">開往</th>
            <th class="col-stop">車站</th>
            <th class="col-eta">分鐘</th>
          </tr>
        </thead>
        <tbody id="bus-table-body">
          <!-- Dynamic rows -->
        </tbody>
      </table>
    </section>

    <footer class="page-footer">
      天氣資料來源：<a href="https://www.hko.gov.hk" target="_blank">香港天文台</a> Open Data API　·　巴士 ETA：KMB / 邨巴時刻表<br>
      每次開啟及每 10 秒自動更新 · 無印風格簡約介面
    </footer>
  </div>

  <script>
    /* ============================================================
       WEATHER (HKO)
       ============================================================ */
    const API_BASE = 'https://data.weather.gov.hk/weatherAPI/opendata/weather.php';

    async function fetchJSON(dataType) {
      const res = await fetch(`${API_BASE}?dataType=${dataType}&lang=tc`);
      if (!res.ok) throw new Error(`API error: ${res.status}`);
      return res.json();
    }

    function getIconUrl(code) {
      return `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${code}.png`;
    }

    function formatWeatherTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return d.toLocaleString('zh-HK', {
        month: 'numeric', day: 'numeric',
        hour: '2-digit', minute: '2-digit', hour12: false
      });
    }

    async function loadWeather() {
      const section = document.getElementById('weather-section');
      try {
        const [rhr, flw, fnd] = await Promise.all([
          fetchJSON('rhrread'),
          fetchJSON('flw'),
          fetchJSON('fnd')
        ]);

        const tempData = rhr.temperature?.data || [];
        const hkoTemp = tempData.find(t => t.place === '香港天文台') || tempData[0];
        const currentTemp = hkoTemp ? hkoTemp.value : '--';

        const humidity = rhr.humidity?.data?.[0]?.value ?? '--';
        const iconCode = (rhr.icon && rhr.icon[0]) || 60;
        const iconUrl = getIconUrl(iconCode);
        const forecastDesc = flw.forecastDesc || flw.generalSituation || '暫無資料';

        const todayForecast = fnd.weatherForecast?.[0] || {};
        const minTemp = todayForecast.forecastMintemp?.value ?? '--';
        const maxTemp = todayForecast.forecastMaxtemp?.value ?? '--';
        const psr = todayForecast.PSR || '—';
        const forecastLabel = todayForecast.week ? `${todayForecast.week}預測` : '今日預測';

        const updateTime = formatWeatherTime(rhr.updateTime || flw.updateTime);

        section.innerHTML = `
          <div class="weather-main">
            <div class="weather-temp">${currentTemp}<span>°</span></div>
            <img class="weather-icon" src="${iconUrl}" alt="天氣圖示"
                 onerror="this.src='https://www.hko.gov.hk/images/wxicon/pic${iconCode}.png'">
            <div class="weather-info">
              <div class="weather-desc">${forecastDesc}</div>
              <div class="weather-range">${forecastLabel}：${minTemp} – ${maxTemp}°C</div>
            </div>
          </div>
          <div class="weather-stats">
            <div class="weather-stat">相對濕度 <strong>${humidity}%</strong></div>
            <div class="weather-stat">降雨概率 <strong>${psr}</strong></div>
          </div>
          <div class="weather-footer" style="grid-column: 1 / -1;">
            <span>更新時間：${updateTime}</span>
            <a href="https://www.hko.gov.hk/tc/wxinfo/currwx/fnd.htm" target="_blank">每時預報 →</a>
          </div>
        `;
      } catch (err) {
        console.error(err);
        section.innerHTML = `
          <div class="error-weather">
            無法載入天氣資料 · <a href="javascript:location.reload()" style="color:var(--text-secondary)">重新載入</a>
          </div>
        `;
      }
    }

    /* ============================================================
       BUS ETA (from original v3.2)
       ============================================================ */
    const BUS_DATA_RAW = `
MB 38 平田 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/C3672D8D28801773/38/1 觀塘區
KMB 38P 平田 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/C3672D8D28801773/38P/1 觀塘區
KMB 40P 觀塘碼頭 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/C3672D8D28801773/40P/1 觀塘區
KMB 42C 藍田站 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/C3672D8D28801773/42C/1 觀塘區
KMB X42P 藍田站 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/C3672D8D28801773/X42P/1 觀塘區
KMB 31B 奧運站 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/C3672D8D28801773/31B/1 油尖旺區
KMB 32 奧運站 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/C3672D8D28801773/32/1 油尖旺區
KMB 35A 尖沙咀東 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/C3672D8D28801773/35A/1 油尖旺區
KMB 35X 尖沙咀東 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/C3672D8D28801773/35X/1 油尖旺區
KMB 36B 高鐵西九龍站 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/C3672D8D28801773/36B/1 油尖旺區
KMB 36X 尖沙咀東麼地道 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/C3672D8D28801773/36X/1 油尖旺區
KMB A30 機場及港珠澳大橋 石排街嘉翠園 https://data.etabus.gov.hk/v1/transport/kmb/eta/BEA270261C1E0D73/A30/1 新界離島區
KMB 936 銅鑼灣棉花路 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/8CF45DD1D6B1FA4D/936/1 港島區
KMB 936A 銅鑼灣棉花路 葵涌業成街 https://data.etabus.gov.hk/v1/transport/kmb/eta/8CF45DD1D6B1FA4D/936A/1 港島區
KMB 40X 烏溪沙站 葵興站 https://data.etabus.gov.hk/v1/transport/kmb/eta/4626B2F2CF370D72/40X/1 沙田區
屋苑 嘉翠園邨巴 葵涌廣場 停車場 SCHEDULE_GREENKNOLL 嘉翠園邨巴
    `.trim();

    const GREENKNOLL_SCHEDULE = {
      weekday: [
        "07:30", "07:50", "08:15", "08:35", "09:00", "09:30",
        "10:30", "11:00", "11:30", "12:00",
        "14:00", "14:30", "15:00", "15:30",
        "17:00", "17:30", "18:00", "18:30", "19:00", "19:30", "20:00", "20:30", "21:00"
      ],
      holiday: [
        "08:00", "08:30", "09:00", "09:30",
        "10:30", "11:00", "11:30",
        "13:30", "14:00", "14:30", "15:00", "15:30",
        "17:00", "17:30", "18:00", "18:30", "19:00", "19:30", "20:00", "20:30", "21:00"
      ]
    };

    const DISTRICT_ORDER = [
      '📍 觀塘區',
      '📍 油尖旺區',
      '📍 新界離島區',
      '📍 港島區',
      '📍 沙田區',
      '📍 嘉翠園邨巴'
    ];

    let parsedRoutes = [];
    let hkPublicHolidays = new Set();
    let secondsSinceLastRefresh = 0;
    let counterInterval = null;

    function parseInputDataSet() {
      const lines = BUS_DATA_RAW.split('\n');
      parsedRoutes = [];
      lines.forEach(line => {
        const parts = line.trim().split(/\s+/);
        if (parts.length >= 6) {
          const [busCoId, route, direction, stopName, targetSrc, district] = parts;
          const formattedDistrict = district.startsWith('📍') ? district : `📍 ${district}`;
          parsedRoutes.push({ busCoId, route, direction, stopName, targetSrc, district: formattedDistrict });
        }
      });
    }

    async function fetchHKPublicHolidays() {
      try {
        const res = await fetch('https://www.1823.gov.hk/common/ical/en.json');
        if (res.ok) {
          const data = await res.json();
          if (data?.vcalendar?.[0]?.vevent) {
            data.vcalendar[0].vevent.forEach(event => {
              if (event.dtstart?.[0]) hkPublicHolidays.add(event.dtstart[0]);
            });
          }
        }
      } catch (err) {
        console.warn('Could not fetch public holidays:', err);
      }
    }

    function getFormattedHKTimestamp(now) {
      const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      const dd = String(now.getDate()).padStart(2, '0');
      const mmm = months[now.getMonth()];
      const yyyy = now.getFullYear();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      return `${yyyy} ${mmm}  ${dd} ${hh}:${mm}`;
    }

    function isTodayHolidayOrSunday(now) {
      if (now.getDay() === 0) return true;
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      return hkPublicHolidays.has(`${yyyy}${mm}${dd}`);
    }

    function calculateShuttleEtas(now) {
      const isHoliday = isTodayHolidayOrSunday(now);
      const scheduleList = isHoliday ? GREENKNOLL_SCHEDULE.holiday : GREENKNOLL_SCHEDULE.weekday;
      const currentMinutesOfDay = now.getHours() * 60 + now.getMinutes();
      const upcoming = [];
      for (const timeStr of scheduleList) {
        const [h, m] = timeStr.split(':').map(Number);
        const diffMin = (h * 60 + m) - currentMinutesOfDay;
        if (diffMin >= 0) {
          upcoming.push(diffMin);
          if (upcoming.length === 3) break;
        }
      }
      return upcoming;
    }

    async function fetchRouteEta(routeObj) {
      const now = new Date();
      if (routeObj.targetSrc === 'SCHEDULE_GREENKNOLL') {
        return calculateShuttleEtas(now);
      }
      if (!routeObj.targetSrc.startsWith('https://')) return [];

      try {
        const response = await fetch(routeObj.targetSrc);
        if (!response.ok) return [];
        const json = await response.json();
        let etaArr = [];

        if (routeObj.busCoId === 'GMB') {
          if (json?.data?.eta && Array.isArray(json.data.eta)) {
            etaArr = json.data.eta.map(item => item.diff).filter(diff => diff >= 0);
          }
        } else {
          if (json?.data && Array.isArray(json.data)) {
            etaArr = json.data
              .filter(item => item.eta)
              .map(item => {
                const etaTime = new Date(item.eta);
                return Math.floor((etaTime - now) / 60000);
              })
              .filter(diff => diff >= 0);
          }
        }
        return etaArr.sort((a, b) => a - b).slice(0, 3);
      } catch (err) {
        console.warn(`Failed to fetch ETA for ${routeObj.route}:`, err);
        return [];
      }
    }

    function renderEtaBadges(minutesArr) {
      if (!minutesArr || minutesArr.length === 0) {
        return `<span class="no-data-msg">尾班車已過</span>`;
      }
      return `<div class="eta-container">` + minutesArr.map(min => {
        let colorClass = 'eta-later';
        if (min < 9) colorClass = 'eta-soon';
        else if (min <= 15) colorClass = 'eta-mid';
        const displayText = min === 0 ? '即將' : `${min}分`;
        return `<span class="badge-eta ${colorClass}">${displayText}</span>`;
      }).join('') + `</div>`;
    }

    async function refreshAllBusEtas() {
      const now = new Date();
      document.getElementById('header-timestamp').textContent = `[${getFormattedHKTimestamp(now)}]`;
      secondsSinceLastRefresh = 0;
      document.getElementById('update-counter').textContent = `更新: 0秒前`;

      const routeResults = await Promise.all(
        parsedRoutes.map(async routeObj => ({
          ...routeObj,
          etas: await fetchRouteEta(routeObj)
        }))
      );

      const groupedByDistrict = {};
      DISTRICT_ORDER.forEach(dist => { groupedByDistrict[dist] = []; });
      routeResults.forEach(item => {
        if (groupedByDistrict[item.district]) {
          groupedByDistrict[item.district].push(item);
        } else {
          groupedByDistrict[item.district] = [item];
        }
      });

      const tableBody = document.getElementById('bus-table-body');
      tableBody.innerHTML = '';

      DISTRICT_ORDER.forEach(districtName => {
        const districtRoutes = groupedByDistrict[districtName] || [];
        const activeRoutes = districtRoutes.filter(r => r.etas && r.etas.length > 0);
        if (activeRoutes.length === 0) return;

        const headerTr = document.createElement('tr');
        headerTr.className = 'district-header-row';
        headerTr.innerHTML = `<th colspan="4">${districtName}</th>`;
        tableBody.appendChild(headerTr);

        activeRoutes.forEach(item => {
          const tr = document.createElement('tr');
          tr.className = 'bus-row';
          tr.innerHTML = `
            <td class="bus-cell"><span class="badge-route">${item.route}</span></td>
            <td class="bus-cell" title="${item.direction}">${item.direction}</td>
            <td class="bus-cell" title="${item.stopName}">${item.stopName}</td>
            <td class="bus-cell">${renderEtaBadges(item.etas)}</td>
          `;
          tableBody.appendChild(tr);
        });
      });
    }

    function startSecondsCounter() {
      if (counterInterval) clearInterval(counterInterval);
      counterInterval = setInterval(() => {
        secondsSinceLastRefresh++;
        document.getElementById('update-counter').textContent = `更新: ${secondsSinceLastRefresh}秒前`;
      }, 1000);
    }

    /* ============================================================
       INIT
       ============================================================ */
    window.onload = function () {
      // Weather
      loadWeather();

      // Bus
      parseInputDataSet();
      fetchHKPublicHolidays();
      refreshAllBusEtas();
      startSecondsCounter();
      setInterval(refreshAllBusEtas, 10000);

      // Optional: refresh weather every 5 minutes
      setInterval(loadWeather, 5 * 60 * 1000);
    };
  </script>
</body>
</html>
